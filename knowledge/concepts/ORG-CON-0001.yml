id: ORG-CON-0001
type: concept
slug: possession
revision: 1
status: draft
definition: An item or asset that is relevant to a person's active or historical relationship with ownership, custody, use, storage, or disposition.
notes:
  - Possession should not be treated as synonymous with physical presence in the home.
  - Historical possession may remain recorded after active responsibility has ended.
evidence_status: working_hypothesis
