id: ORG-CON-0003
type: concept
slug: custody
revision: 1
status: draft
definition: The relationship describing who currently physically holds, controls, or is responsible for an item, regardless of who owns it.
notes:
  - Custody may be temporary.
  - Loaned items commonly have different ownership and custody.
