  - id: ua_obs_korobky_custom
    observed_at: 2026-09-13
    supplier: Korobky.ua
    capabilities:
      custom_size_min_qty: 50
      prototype_qty: "1-5"
      logo_printing: true
    source: https://korobky.com.ua/chotyryklapanni-korobkyy/

market_interpretation:
  - >-
    Retail category names are unreliable ontology. The same physical construction can appear
    as an archive box, moving box, or food-set box. Match by capabilities and geometry first.
  - >-
    In at least one current PanBox listing, the 328x230x210 archive box with handles and the
    version explicitly marked "without handles" have the same listed price. This makes handles
    a high-value UX feature when available at parity.
  - >-
    Sotalan currently lists self-assembling archive-style boxes with lid and cutout handles at
    21.60-44.00 UAH across several household-usable sizes. This supports treating archive-style
    construction as a mainstream option rather than a premium niche.
  - >-
    A 500x300x300 regular four-flap box from Korobky.ua is listed at 62 UAH retail and 38 UAH at
    300 units. Size and supplier differences prevent a strict like-for-like comparison, but the
    archive-style market is clearly not automatically 10-30 UAH more expensive.

rechibox_projection:
  role: >-
    rechibox should recommend the container type that best fits the user's contents and storage
    environment, then choose whether to route the user to a third-party Ukrainian supplier or
    offer a rechibox-branded equivalent.
  candidate_launch_skus:
    - id: rechibox_m
      target_inner_size_mm: [400, 300, 250]
      target_use: general_household_storage
      preferred_construction: archive_style_box
      desired_capabilities:
        - lid
        - handles
        - recloseable_without_consumables
        - unique_qr_zone
    - id: rechibox_l
      target_inner_size_mm: [600, 400, 300]
      target_use: clothes_toys_light_bulk
      preferred_construction: archive_style_box
      desired_capabilities:
        - lid
        - handles
        - unique_qr_zone
    - id: rechibox_heavy
      target_inner_size_mm: [400, 300, 250]
      target_use: books_tools_dense_items
      preferred_construction: reinforced_cardboard_box
      desired_capabilities:
        - handles
        - load_marking
        - unique_qr_zone

  identity_strategy:
    static_print:
      - rechibox_brand
      - handling_icons
      - qr_target_area
      - room_field
      - max_weight_field
    variable_identity:
      - unique_qr_sticker
      - box_id
    rationale: >-
      Use inexpensive repeated printing for shared artwork and variable labels for unique box
      identity. Avoid making every corrugated box a separately printed variable-data product.
