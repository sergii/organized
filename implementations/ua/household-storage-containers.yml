    source: https://sotalan.com/uk/arhivnyie-boksyi-arhivnyie-korobki

  - id: ua_obs_korobky_regular_500
    observed_at: 2026-09-13
    supplier: Korobky.ua
    category: regular_slotted_box
    product:
      size_mm: [500, 300, 300]
      board: T22C
      listed_prices_uah:
