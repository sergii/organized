$schema: https://json-schema.org/draft/2020-12/schema
$id: https://organized.sh/schemas/situation-model-v0.1.schema.json
title: Organized Situation Model v0.1
type: object
additionalProperties: false
required:
  - contract_version
  - raw_input
  - facts
  - goals
  - constraints
  - uncertainties
  - hypotheses
  - entities
properties:
  contract_version:
    const: '0.1'
  raw_input:
    type: string
    minLength: 1
  facts:
    type: array
    items:
      $ref: '#/$defs/statement'
  goals:
    type: array
    items:
      $ref: '#/$defs/statement'
  constraints:
    type: array
    items:
      $ref: '#/$defs/statement'
  uncertainties:
    type: array
    items:
      $ref: '#/$defs/statement'
  hypotheses:
    type: array
    items:
      allOf:
        - $ref: '#/$defs/statement'
        - type: object
          required: [confidence]
          properties:
            confidence:
              type: number
              minimum: 0
              maximum: 1
  entities:
    type: array
    items:
      $ref: '#/$defs/entity'
$defs:
  statement:
    type: object
    additionalProperties: false
    required: [text]
    properties:
      text:
        type: string
        minLength: 1
      source:
        type: string
        enum: [user, observed, inferred]
      confidence:
        type: number
        minimum: 0
        maximum: 1
  entity:
    type: object
    additionalProperties: false
    required: [ref, kind, label, attributes]
    properties:
      ref:
        type: string
        pattern: '^E[0-9]+$'
      kind:
        type: string
        enum: [space, item, container, furniture, person, collection, other]
      label:
        type: string
        minLength: 1
      attributes:
        type: object
        additionalProperties:
          type: [string, number, boolean, 'null']
