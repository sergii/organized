$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/sergii/organized/main/schemas/source.schema.yml
title: Organized source
type: object
required: [id, type, source_type, title]
properties:
  id: { type: string, pattern: '^ORG-SRC-[0-9]{4}$' }
  type: { const: source }
  source_type: { type: string, enum: [book, article, research, professional_practice, community, video, web, other] }
  title: { type: string, minLength: 1 }
  authors:
    type: array
    items: { type: string, minLength: 1 }
  url: { type: string, minLength: 1 }
  published_at: { type: string }
  accessed_at: { type: string }
  license: { type: string }
  notes:
    type: array
    items: { type: string, minLength: 1 }
additionalProperties: false
