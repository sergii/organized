$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/sergii/organized/main/schemas/question.schema.yml
title: Organized question
type: object
required: [id, type, question, status, case_ids, related_knowledge, occurrence_count, notes]
properties:
  id: { type: string, pattern: '^ORG-Q-[0-9]{4}$' }
  type: { const: question }
  question: { type: string, minLength: 1 }
  status: { type: string, enum: [captured, answered, converted_to_gap, closed] }
  case_ids:
    type: array
    uniqueItems: true
    items: { type: string, pattern: '^ORG-CASE-[0-9]{4}$' }
  related_knowledge:
    type: array
    uniqueItems: true
    items: { type: string, pattern: '^ORG-(PR|HEU|PRA|AP|CON)-[0-9]{4}$' }
  gap_id:
    type: string
    pattern: '^ORG-GAP-[0-9]{4}$'
  occurrence_count: { type: integer, minimum: 1 }
  notes:
    type: array
    items: { type: string, minLength: 1 }
additionalProperties: false
