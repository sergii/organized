$schema: https://json-schema.org/draft/2020-12/schema
$title: Organized observation

type: object
required:
  - id
  - type
  - observation_type
  - statement

properties:
  id:
    type: string
    pattern: '^ORG-OBS-[0-9]{4}$'
  type:
    const: observation
  observation_type:
    enum: [direct, participant_report, inference, source_claim]
  statement:
    type: string
  session_id:
    type: string
  source_id:
    type: string
  case_id:
    type: string
  supports:
    type: array
    items: { type: string }
  contradicts:
    type: array
    items: { type: string }
  confidence:
    enum: [low, medium, high]
  notes:
    type: array
    items: { type: string }

additionalProperties: true
