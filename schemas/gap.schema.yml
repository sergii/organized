$schema: https://json-schema.org/draft/2020-12/schema
$title: Organized knowledge gap

type: object
required:
  - id
  - type
  - question
  - status

properties:
  id:
    type: string
    pattern: '^ORG-GAP-[0-9]{4}$'
  type:
    const: gap
  question:
    type: string
  status:
    enum: [open, researching, partially_resolved, resolved, rejected]
  case_ids:
    type: array
    items: { type: string }
  related_knowledge:
    type: array
    items: { type: string }
  observation_ids:
    type: array
    items: { type: string }
  source_ids:
    type: array
    items: { type: string }
  resolution:
    type: string

additionalProperties: true
