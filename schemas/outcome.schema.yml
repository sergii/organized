$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/sergii/organized/main/schemas/outcome.schema.yml
title: Organized outcome
type: object
required: [id, type, session_id, status, summary]
properties:
  id: { type: string, pattern: '^ORG-OUT-[0-9]{4}$' }
  type: { const: outcome }
  session_id: { type: string, pattern: '^ORG-SES-[0-9]{4}$' }
  status: { type: string, enum: [observed, verified] }
  summary: { type: string, minLength: 1 }
  metrics: { type: object }
  notes:
    type: array
    items: { type: string, minLength: 1 }
additionalProperties: false
