$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/sergii/organized/main/schemas/session.schema.yml
title: Organized session
type: object
required: [id, type, case_id, status, goal, context, constraints, actions, notes]
properties:
  id: { type: string, pattern: '^ORG-SES-[0-9]{4}$' }
  type: { const: session }
  case_id: { type: string, pattern: '^ORG-CASE-[0-9]{4}$' }
  status: { type: string, enum: [planned, active, completed, abandoned] }
  goal: { type: string, minLength: 1 }
  context:
    type: object
  constraints:
    type: array
    items: { type: string, minLength: 1 }
  actions:
    type: array
    items: { type: object }
  notes:
    type: array
    items: { type: string, minLength: 1 }
additionalProperties: false
