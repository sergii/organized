name: Validate knowledge base

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.12'
          bundler-cache: true
      - name: Validate schemas, references, and locales
        run: bundle exec ruby scripts/validate.rb
      - name: Validate runtime export contract
        run: bundle exec ruby scripts/export_runtime.rb tmp/organized-v1.jsonl
      - name: Validate Situation Model examples
        run: bundle exec ruby scripts/validate_situations.rb
