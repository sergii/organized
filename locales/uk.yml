locale: uk
version: 1

knowledge:
  ORG-PR-0001:
    title: Торкайся речей, щоб змінювати їхній стан, а не просто місце
    summary: Постійне перекладання невирішених речей створює роботу, але не розв'язує саму проблему.
    guidance: Намагайся, щоб взаємодія з річчю давала нову інформацію, вирішувала питання власності, завершувала рішення, disposition або визначала стабільне місце зберігання.

  ORG-PR-0002:
    title: Спочатку створи вільну ємність, потім організовуй
    summary: У тісному просторі першою метою часто має бути достатньо вільного місця, щоб можна було безпечно думати, оглядати, сортувати й рухати речі.
    guidance: Спершу прибери очевидне сміття та інші вже вирішені виходи, створи невелику робочу зону, і лише потім переходь до детальної організації.

  ORG-PR-0003:
    title: Завершена передача має залишати активний inventory
    summary: Якщо річ справді подарована, продана, віддана, утилізована або викинута, вона більше не повинна займати місце в активній ментальній пам'яті.
    guidance: Історію можна зберігати, якщо вона корисна, але минуле володіння треба відокремлювати від поточної власності, custody та відповідальності.

  ORG-HEU-0001:
    title: Decluttering leverage
    summary: У тісному просторі варто першими робити дії, які звільняють відчутний обсяг при високій впевненості в рішенні та невеликій ціні зусиль.
    guidance: Це допоміжний спосіб пріоритизації, а не автоматичне правило викидання. Власність, безпека, емоційна цінність і незворотні наслідки можуть бути важливішими.

cases:
  ORG-CASE-0001:
    title: Розбір захаращеної кімнати з обмеженим простором
    summary: Невелика кімната щільно заповнена меблями, коробками, паперами, невідомими речами та предметами з неясним власником, цінністю або майбутнім використанням.
    problem: У кімнаті недостатньо вільного місця для класичного сортування, тому просте перекладання речей може створювати активність без реального прогресу.
    goal: Спочатку створити достатньо фізичної та когнітивної ємності для хороших рішень, а вже потім організувати тільки те, що залишилося після цих рішень.
    stages:
      establish_rules: Захиститися від небезпечних або незворотних рішень.
      zero_decision_exits: Спочатку прибрати очевидне сміття та інші вже вирішені виходи.
      create_working_zone: Створити невелику стабільну зону для огляду й сортування.
      resolve_large_high_leverage_items: Використати очевидні рішення щодо великих речей, щоб швидко отримати маневровий простір.
      reduce_uncertainty: Ідентифікувати невідомі речі, їхнього власника та поточний стан.
      process_survivors: Визначити, що справді має залишатися активною частиною життя і простору.
      organize_after_reduction: Призначити стабільні місця лише після того, як набір речей, що залишаються, став зрозумілішим.
