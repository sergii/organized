locale: uk
version: 3

knowledge:
  ORG-PR-0001:
    source_revision: 1
    title: Торкайся речей, щоб змінювати їхній стан, а не лише місце
    summary: Постійне перекладання невирішених речей створює роботу, але не розв'язує саму проблему.
    guidance: Намагайся, щоб взаємодія з річчю давала нову інформацію, з'ясовувала належність, приводила до рішення щодо її подальшої долі або визначала стабільне місце.
  ORG-PR-0002:
    source_revision: 1
    title: Спочатку звільни робочий простір, потім організовуй
    summary: У тісному просторі першою метою часто є створити достатньо місця, щоб можна було безпечно оглядати, сортувати й переміщати речі.
    guidance: Спершу прибери очевидне сміття й речі з уже прийнятим рішенням та створи невелику робочу зону. Детальну організацію залиш на потім.
  ORG-PR-0003:
    source_revision: 1
    title: Після завершеного вибуття річ має зникнути з активного обліку
    summary: Якщо річ справді подарована, продана, віддана, перероблена або викинута, вона більше не повинна займати місце в активному обліку й пам'яті.
    guidance: За потреби зберігай історію, але відокремлюй минуле володіння від поточної належності, фізичного утримання та відповідальності.
  ORG-PR-0004:
    source_revision: 1
    title: Утримання речей теж має ціну
    summary: Річ займає простір і увагу, може вимагати обслуговування, перевезення та майбутніх рішень навіть тоді, коли за саме зберігання не треба платити.
    guidance: Порівнюй користь від речі з витратами простору, уваги, обслуговування та мобільності, а не вважай продовження володіння безкоштовним.
  ORG-PR-0005:
    source_revision: 1
    title: Продаж теж має свою вартість
    summary: Ціна перепродажу не дорівнює чистій вигоді після витрат часу, зусиль, координації, ризику й доставки.
    guidance: Оцінюй, чи очікувана виручка виправдовує потрібну роботу. Для дешевих речей може бути корисним особистий мінімальний поріг продажу.
  ORG-PR-0006:
    source_revision: 1
    title: Ціна покупки не дорівнює поточній цінності
    summary: Те, скільки річ коштувала в минулому, не визначає її економічну або особисту цінність сьогодні.
    guidance: Для поточного рішення дивись на реальну корисність, вартість заміни, ціну перепродажу, стан, рідкість та особисту цінність, а не на вже витрачені гроші.
  ORG-HEU-0001:
    source_revision: 1
    title: Віддача від розхламлення
    summary: У тісному просторі першими варто робити дії, які звільняють помітний обсяг при високій впевненості в рішенні та невеликих зусиллях.
    guidance: Це спосіб визначити пріоритет, а не автоматичне правило викидання. Належність, безпека, емоційна цінність і незворотні наслідки можуть бути важливішими.
  ORG-CON-0001:
    source_revision: 1
    title: Річ у системі володіння
    summary: Предмет або актив, важливий для поточного чи минулого зв'язку людини з належністю, фізичним утриманням, використанням, зберіганням або рішенням щодо подальшої долі.
  ORG-CON-0002:
    source_revision: 1
    title: Належність
    summary: Хто має основне право на річ і повноваження приймати щодо неї незворотні рішення.
  ORG-CON-0003:
    source_revision: 1
    title: Фізичне утримання
    summary: У кого річ фізично перебуває, хто її контролює або несе за неї практичну відповідальність, незалежно від того, кому вона належить.
  ORG-CON-0004:
    source_revision: 1
    title: Місцезнаходження
    summary: Поточне фізичне місце, де очікується знайти річ.
  ORG-CON-0005:
    source_revision: 1
    title: Рішення щодо подальшої долі
    summary: Поточне рішення щодо речі - залишити, перемістити, позичити, продати, віддати, переробити, викинути або залишити на подальший розгляд.

cases:
  ORG-CASE-0001:
    source_revision: 1
    title: Розбір захаращеної кімнати з обмеженим простором
    summary: Невелика кімната щільно заповнена меблями, коробками, паперами, невідомими речами та предметами з неясною належністю, цінністю або майбутнім використанням.
    problem: У кімнаті недостатньо вільного місця для класичного сортування, тому просте перекладання речей може створювати активність без реального прогресу.
    goal: Спочатку створити достатньо фізичного й розумового простору для хороших рішень, а вже потім організувати тільки те, що справді залишається.
    stages:
      establish_rules: Захиститися від небезпечних або незворотних рішень.
      zero_decision_exits: Спочатку прибрати очевидне сміття та речі з уже прийнятим рішенням.
      create_working_zone: Створити невелику стабільну зону для огляду й сортування.
      resolve_large_high_leverage_items: Використати очевидні рішення щодо великих речей, щоб швидко отримати маневровий простір.
      reduce_uncertainty: Ідентифікувати невідомі речі, їхню належність і поточний стан.
      process_survivors: Визначити, що справді має залишатися активною частиною життя і простору.
      organize_after_reduction: Призначити стабільні місця лише після того, як набір речей, що залишаються, став зрозумілішим.
