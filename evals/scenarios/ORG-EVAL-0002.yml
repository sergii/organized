id: ORG-EVAL-0002
title: Mixed ownership, sentimental value, and selling cost
status: draft
user_input: >-
  Розгрібаю кімнату і вже завис: є дві коробки речей колишньої дівчини,
  старі фото й подарунки, купа техніки, яку шкода викинути, бо колись дорого купував.
  Хочу звільнити місце за вихідні і думаю все цінне виставити на OLX, але не хочу
  потім пошкодувати чи витратити весь день на продаж дрібниць. Як би ти це розібрав?
