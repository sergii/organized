$schema: "https://json-schema.org/draft/2020-12/schema"
title: SituationExtractionV1
type: object
additionalProperties: false
required:
  - facts
  - goals
  - uncertainties
  - hypotheses
properties:
  facts:
    type: object
    additionalProperties: false
    required:
      - space_type
      - area_m2
      - floor_obstructed
      - objects_mentioned
    properties:
      space_type:
        type: [string, "null"]
      area_m2:
        type: [number, "null"]
        minimum: 0
      floor_obstructed:
        type: [boolean, "null"]
      objects_mentioned:
        type: array
        items:
          type: string
  goals:
    type: array
    items:
      type: string
  uncertainties:
    type: array
    items:
      type: string
  hypotheses:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - claim
        - confidence
      properties:
        claim:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
