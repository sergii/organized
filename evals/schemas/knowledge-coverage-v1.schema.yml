$schema: "https://json-schema.org/draft/2020-12/schema"
title: KnowledgeCoverageV1
type: object
additionalProperties: false
required:
  - response_x
  - response_y
  - response_z
properties:
  response_x:
    $ref: "#/$defs/coverage"
  response_y:
    $ref: "#/$defs/coverage"
  response_z:
    $ref: "#/$defs/coverage"
$defs:
  coverage:
    type: object
    additionalProperties: false
    required:
      - covered
      - missed
      - coverage_percent
      - summary
    properties:
      covered:
        type: array
        items:
          type: string
      missed:
        type: array
        items:
          type: string
      coverage_percent:
        type: integer
        minimum: 0
        maximum: 100
      summary:
        type: string
